<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .brand-num { font-family: 'Outfit', 'Inter', sans-serif; font-weight: 800; font-size: 32px; fill: url(#logo-grad); }
    .brand-text { font-family: 'Outfit', 'Inter', sans-serif; font-weight: 700; font-size: 26px; fill: #FFFFFF; }
    .light-theme-text { fill: #0F172A; }
  </style>
  <g transform="translate(5, 5)">
    <!-- Tech styled 7 icon -->
    <path d="M 5 5 L 35 5 L 20 40 L 12 40 L 23 13 L 5 13 Z" fill="url(#logo-grad)" filter="url(#glow)"/>
    <text x="42" y="32" class="brand-text">Speak</text>
  </g>
</svg>
