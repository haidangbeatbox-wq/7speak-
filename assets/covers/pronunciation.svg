<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="280" rx="12" fill="url(#bg-grad)" />
  
  <!-- Tech Grid Lines -->
  <g stroke="rgba(52, 211, 153, 0.08)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280" />
    <line x1="80" y1="0" x2="80" y2="280" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="240" y1="0" x2="240" y2="280" />
    <line x1="280" y1="0" x2="280" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="360" y1="0" x2="360" y2="280" />
    
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>
  
  <!-- Glow Effect Base -->
  <circle cx="340" cy="220" r="90" fill="#34D399" opacity="0.15" filter="blur(35px)" />
  <circle cx="80" cy="60" r="70" fill="#4F46E5" opacity="0.1" filter="blur(25px)" />
  
  <!-- Decorative Soundwave Graphic -->
  <g transform="translate(305, 50)" stroke="url(#accent-grad)" stroke-width="2" stroke-linecap="round">
    <line x1="5" y1="25" x2="5" y2="35" />
    <line x1="12" y1="15" x2="12" y2="45" />
    <line x1="19" y1="5" x2="19" y2="55" />
    <line x1="26" y1="20" x2="26" y2="40" />
    <line x1="33" y1="10" x2="33" y2="50" />
    <line x1="40" y1="22" x2="40" y2="38" />
  </g>
  
  <!-- Tag -->
  <rect x="25" y="25" width="115" height="24" rx="12" fill="url(#primary-grad)" />
  <text x="82.5" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">PRONUNCIATION</text>

  <!-- Main Titles -->
  <text x="25" y="105" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28">PRONUNCIATION</text>
  <text x="25" y="135" fill="url(#accent-grad)" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="20">Accent &amp; Intonation</text>
  
  <!-- Subtitle / Meta -->
  <text x="25" y="180" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Phonetics, linking sounds, and stress masterclass</text>
  
  <!-- Document Details Line -->
  <g transform="translate(25, 215)">
    <!-- Book Icon -->
    <path d="M 0 0 L 15 0 C 18 0, 18 3, 18 5 L 18 20 C 18 18, 15 17, 12 17 L 0 17 Z M 0 17 C 3 17, 5 18, 5 20 C 5 22, 3 23, 0 23 Z" fill="none" stroke="#34D399" stroke-width="2" />
    <text x="26" y="15" fill="#34D399" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PDF RESOURCE</text>
    <circle cx="150" cy="10" r="3" fill="#059669" />
    <text x="162" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">80 Pages</text>
  </g>
</svg>
