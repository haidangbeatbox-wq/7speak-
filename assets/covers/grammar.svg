<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="280" rx="12" fill="url(#bg-grad)" />
  
  <!-- Tech Grid Lines -->
  <g stroke="rgba(96, 165, 250, 0.08)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280" />
    <line x1="80" y1="0" x2="80" y2="280" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="240" y1="0" x2="240" y2="280" />
    <line x1="280" y1="0" x2="280" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="360" y1="0" x2="360" y2="280" />
    
    <line x1="0" y1="40" x2="400" y2="40" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="240" x2="400" y2="240" />
  </g>
  
  <!-- Glow Effect Base -->
  <circle cx="340" cy="80" r="90" fill="#3B82F6" opacity="0.12" filter="blur(35px)" />
  <circle cx="80" cy="220" r="70" fill="#93C5FD" opacity="0.08" filter="blur(25px)" />
  
  <!-- Decorative Grammar Graphic -->
  <g transform="translate(310, 45)" fill="none" stroke="url(#accent-grad)" stroke-width="1.5">
    <polygon points="25,5 45,15 45,35 25,45 5,35 5,15" fill="rgba(59, 130, 246, 0.1)"/>
    <line x1="25" y1="5" x2="25" y2="45" />
    <line x1="5" y1="15" x2="45" y2="35" />
    <line x1="5" y1="35" x2="45" y2="15" />
  </g>
  
  <!-- Tag -->
  <rect x="25" y="25" width="80" height="24" rx="12" fill="url(#primary-grad)" />
  <text x="65" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="11" text-anchor="middle">GRAMMAR</text>

  <!-- Main Titles -->
  <text x="25" y="105" fill="#FFFFFF" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="28">SPEAKING GRAMMAR</text>
  <text x="25" y="135" fill="url(#accent-grad)" font-family="'Outfit', 'Inter', sans-serif" font-weight="700" font-size="20">Sentence Patterns</text>
  
  <!-- Subtitle / Meta -->
  <text x="25" y="180" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">Natural structures, modal verbs, and flow control</text>
  
  <!-- Document Details Line -->
  <g transform="translate(25, 215)">
    <!-- Book Icon -->
    <path d="M 0 0 L 15 0 C 18 0, 18 3, 18 5 L 18 20 C 18 18, 15 17, 12 17 L 0 17 Z M 0 17 C 3 17, 5 18, 5 20 C 5 22, 3 23, 0 23 Z" fill="none" stroke="#60A5FA" stroke-width="2" />
    <text x="26" y="15" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="12" font-weight="700">PDF RESOURCE</text>
    <circle cx="150" cy="10" r="3" fill="#3B82F6" />
    <text x="162" y="14" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">115 Pages</text>
  </g>
</svg>
